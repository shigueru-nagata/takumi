[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "takumi"
version = "0.1.0"
description = "Handcrafted CLI for VASP post-processing and data analysis   "
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
takumi = "takumi.main:app"